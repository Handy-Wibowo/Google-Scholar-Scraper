name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**"]
    tags: ["v3.*"]
  pull_request:
    branches: [main]
    paths: ["rust/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      - name: Packaging smoke (headless export contract)
        run: |
          cargo build -p gss-app
          $dir = Join-Path $env:RUNNER_TEMP smoke
          # Start-Process -Wait: the release profile is a GUI-subsystem binary, and
          # PowerShell does not wait for those, so "&" leaves $LASTEXITCODE empty.
          $proc = Start-Process -FilePath target\debug\gss-app.exe -ArgumentList "--packaging-smoke `"$dir`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "packaging smoke failed with exit code $($proc.ExitCode)" }
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }

  release:
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p gss-app

      - name: Build the Windows installer
        # 7.10: the release used to attach only the bare exe, so the configured
        # NSIS bundle target was never produced by CI. Build it here so users get
        # the installed-app path without a local build on the author's machine.
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles nsis
          Get-ChildItem target\release\bundle\nsis

      - name: Packaging smoke on the shipped exe
        run: |
          $dir = Join-Path $env:RUNNER_TEMP smoke
          # Start-Process -Wait: the release profile is a GUI-subsystem binary, and
          # PowerShell does not wait for those, so "&" leaves $LASTEXITCODE empty.
          $proc = Start-Process -FilePath target\release\gss-app.exe -ArgumentList "--packaging-smoke `"$dir`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "packaging smoke failed with exit code $($proc.ExitCode)" }
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }

      - name: Stage artifacts
        run: |
          # github.ref_name already carries the leading "v" for tag pushes.
          $stage = Join-Path $env:RUNNER_TEMP stage
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\gss-app.exe "$stage\GoogleScholarScraper-${{ github.ref_name }}.exe"
          # The installer's filename contains a space; normalise it for the release.
          $setup = Get-ChildItem target\release\bundle\nsis\*.exe | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "$stage\Google.Scholar.Scraper-${{ github.ref_name }}-x64-setup.exe"
          } else {
            throw "NSIS installer was not produced"
          }
          $hash = (Get-FileHash "$stage\GoogleScholarScraper-${{ github.ref_name }}.exe" -Algorithm SHA256).Hash
          $setupHash = (Get-FileHash "$stage\Google.Scholar.Scraper-${{ github.ref_name }}-x64-setup.exe" -Algorithm SHA256).Hash
          @(
            "$hash  GoogleScholarScraper-${{ github.ref_name }}.exe",
            "$setupHash  Google.Scholar.Scraper-${{ github.ref_name }}-x64-setup.exe"
          ) | Out-File "$stage\SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256: $hash"
          Write-Host "Setup SHA256: $setupHash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/stage/GoogleScholarScraper*
            ${{ runner.temp }}/stage/SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/stage/GoogleScholarScraper*
            ${{ runner.temp }}/stage/SHA256SUMS.txt
