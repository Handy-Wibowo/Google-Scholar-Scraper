name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**"]
    tags: ["v3.*"]
  pull_request:
    branches: [main]
    paths: ["rust/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      - name: Packaging smoke (headless export contract)
        run: |
          cargo build -p gss-app
          $dir = Join-Path $env:RUNNER_TEMP smoke
          & target\debug\gss-app.exe --packaging-smoke $dir
          if ($LASTEXITCODE -ne 0) { throw "packaging smoke failed" }
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }

  release:
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p gss-app

      - name: Packaging smoke on the shipped exe
        run: |
          $dir = Join-Path $env:RUNNER_TEMP smoke
          & target\release\gss-app.exe --packaging-smoke $dir
          if ($LASTEXITCODE -ne 0) { throw "packaging smoke failed" }

      - name: Stage artifacts
        run: |
          $stage = Join-Path $env:RUNNER_TEMP stage
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\gss-app.exe "$stage\GoogleScholarScraper-v${{ github.ref_name }}.exe"
          $hash = (Get-FileHash "$stage\GoogleScholarScraper-v${{ github.ref_name }}.exe" -Algorithm SHA256).Hash
          "$hash  GoogleScholarScraper-v${{ github.ref_name }}.exe" | Out-File "$stage\SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/stage/GoogleScholarScraper*
            ${{ runner.temp }}/stage/SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/stage/GoogleScholarScraper*
            ${{ runner.temp }}/stage/SHA256SUMS.txt
