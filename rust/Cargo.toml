[workspace]
resolver = "2"
members = ["gss-core", "gss-app", "gss-parity"]

[workspace.package]
version = "3.1.0"
edition = "2021"
license = "SEE LICENSE IN ../src/LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
